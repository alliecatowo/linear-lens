# Weekly version updates. Minor and patch bumps are grouped into one PR and
# auto-merged by .github/workflows/dependabot-automerge.yml once required CI is
# green; major bumps arrive as separate PRs labelled `major-update`.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  # Must stay <= engines.vscode: vsce package refuses a newer @types/vscode.
  - dependency-name: "@types/vscode"
  # typescript-eslint does not support TypeScript 7 yet (tracking:
  # https://github.com/typescript-eslint/typescript-eslint/issues/10940).
  - dependency-name: typescript
    versions:
    - ">=7"
