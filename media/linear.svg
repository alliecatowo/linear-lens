<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!--
    Linear Lens Activity Bar icon.
    Single-color, uses `currentColor` so VS Code themes it for active/inactive and
    high-contrast states. A focusing "lens" of three nested diagonal strokes,
    evoking the Linear mark without a hardcoded brand-purple fill.
  -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <path d="M3.2 14.5 L9.5 20.8" />
    <path d="M3.1 10.4 L13.6 20.9" />
    <path d="M3.4 6.6 L17.4 20.6" />
    <path d="M6.6 3.4 L20.6 17.4" />
    <path d="M10.4 3.1 L20.9 13.6" />
    <path d="M14.5 3.2 L20.8 9.5" />
  </g>
</svg>
